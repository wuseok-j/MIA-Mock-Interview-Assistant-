<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320">
<rect width="1440" height="1320" fill="#f3f4f6"/>
<text x="64" y="32" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="32" fill="#202630">채팅 플레이 · 웹 화면 상태</text>
<text x="64" y="84" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#68707c">수정안 v2 · 같은 화면에서 바뀌는 영역 / 실제 동작 검증 전</text>
<rect x="64" y="134" width="640" height="256" rx="8" fill="#ffffff" stroke="#c7cbd1"/>
<text x="88" y="154" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#202630">01 / 준비 중 → 정상 입력</text>
<text x="88" y="201" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">상황을 불러오는 중… / 입력·보내기 비활성화</text>
<text x="88" y="233" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">실패하면 오류 안내와 다시 시도 버튼 표시</text>
<text x="88" y="265" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">정상 진입 후 단계·상황·남은 기회 표시</text>
<text x="88" y="297" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">공백만 입력한 경우 보내기 비활성화</text>
<text x="88" y="329" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">입력창 이름: 내가 할 행동 / 최대 300자</text>
<rect x="728" y="134" width="640" height="256" rx="8" fill="#ffffff" stroke="#c7cbd1"/>
<text x="752" y="154" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#202630">02 / 응답 대기</text>
<text x="752" y="201" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">내 발언은 임시 말풍선으로 표시</text>
<text x="752" y="233" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">상대가 반응하는 중…</text>
<text x="752" y="265" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">입력·보내기 잠금 / 연속 Enter 제출 방지</text>
<text x="752" y="297" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">서버 응답으로 확정 대화를 교체</text>
<text x="752" y="329" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">임의의 진행률·가짜 남은 시간은 표시하지 않음</text>
<rect x="64" y="414" width="640" height="256" rx="8" fill="#ffffff" stroke="#c7cbd1"/>
<text x="88" y="434" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#202630">03 / 입력 차단·추가 확인</text>
<text x="88" y="481" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">차단: 안내 후 다시 입력 가능</text>
<text x="88" y="513" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">차단 입력에서는 위험도·판단 기회 유지</text>
<text x="88" y="545" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">추가 확인: 캐릭터가 구체적인 행동을 되묻기</text>
<text x="88" y="577" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">행동 미확인을 곧바로 위험 행동으로 표시하지 않음</text>
<text x="88" y="609" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">정상 처리된 추가 확인은 남은 기회에 반영</text>
<rect x="728" y="414" width="640" height="256" rx="8" fill="#ffffff" stroke="#c7cbd1"/>
<text x="752" y="434" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#202630">04 / 통신 오류·AI 장애</text>
<text x="752" y="481" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">통신 오류: 작성 문장 복원 + 오류 안내</text>
<text x="752" y="513" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">AI 장애: 재입력 안내 / 판단 기회·위험도 유지</text>
<text x="752" y="545" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">확정되지 않은 요청은 자동으로 재전송하지 않음</text>
<text x="752" y="577" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">서버 처리 여부가 불명확하면 중복 처리 가능성 안내</text>
<text x="752" y="609" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">안전한 재시도·중복 요청 정책은 백엔드 협의 필요</text>
<rect x="64" y="694" width="640" height="256" rx="8" fill="#ffffff" stroke="#c7cbd1"/>
<text x="88" y="714" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#202630">05 / 단계 전환·위험도 변화</text>
<text x="88" y="761" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">대화 구분선: 2단계 · 엘리베이터 앞</text>
<text x="88" y="793" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">왼쪽 장면·상황과 상단 단계·기회를 함께 갱신</text>
<text x="88" y="825" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">예시: 위험도 0 → 3 / +3</text>
<text x="88" y="857" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">원인: 서버가 확정한 사유가 있을 때만 표시</text>
<text x="88" y="889" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">사유 전용 API 미구현 / 없으면 수치 변화만 표시</text>
<rect x="728" y="694" width="640" height="256" rx="8" fill="#ffffff" stroke="#c7cbd1"/>
<text x="752" y="714" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#202630">06 / 종료·판단 복기</text>
<text x="752" y="761" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">건물 밖 도착 / 대피 중단을 구분해 안내</text>
<text x="752" y="793" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">입력창 대신 [판단 복기 보기] 버튼 표시</text>
<text x="752" y="825" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">도착만으로 모든 행동 기준 충족을 의미하지 않음</text>
<text x="752" y="857" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">플레이 중의 답안 공개 대신 리포트에서 근거 비교</text>
<text x="752" y="889" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">남은 판단 기회는 0 / 추가 입력 불가</text>
<rect x="64" y="974" width="1312" height="268" rx="8" fill="#ffffff" stroke="#c7cbd1"/>
<text x="88" y="994" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#202630">07 / 목록 이동·작은 데스크톱 창</text>
<text x="88" y="1042" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">목록 이동 전: “현재 플레이를 나가시겠습니까? 목록에서 이어하기는 지원하지 않습니다.”</text>
<text x="88" y="1074" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">[계속 플레이] [목록으로 이동] / 저장 완료라고 안내하지 않음</text>
<text x="88" y="1106" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">기준 화면: 1440px 폭 / 1280 × 720에서도 제목·위험도·입력창·보내기 버튼 확인</text>
<text x="88" y="1138" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">장면 높이를 줄이고 대화 영역 내부 스크롤 유지 / 키보드 Tab으로 입력·버튼 접근</text>
<text x="88" y="1170" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#505966">현재 상황 설명 전용 필드와 위험도 변화 사유는 API 보완 후 연결 / 모바일 화면은 이번 범위에서 제외</text>
<text x="64" y="1274" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#68707c">정상 상태의 구조는 본 와이어프레임 참고. 이 시트는 상태별 설계이며 화면 구현 완료를 의미하지 않음.</text>
</svg>